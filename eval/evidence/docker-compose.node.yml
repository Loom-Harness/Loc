# Auto-generated.
#
# Metrics + traces are opt-in — add the observability overlay:
#   docker compose -f docker-compose.yml -f docker-compose.obs.yml up
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
      bus:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres:postgres@db:5432/api"
      LOG_LEVEL: "info"
      LOOM_CHANNEL_LIFECYCLE_BUS_URL: "redis://:loom-dev-bus@bus:6379"
      CORS_ORIGIN: "http://localhost:3001"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./web
    environment:
      VITE_API_BASE_URL: "http://localhost:3000/api"
      VITE_API_PROXY_TARGET: "http://api:3000"
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  bus:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--requirepass", "loom-dev-bus"]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "loom-dev-bus", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  photos:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - photos-data:/data

volumes:
  pgdata: {}
  photos-data: {}
