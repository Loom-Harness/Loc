# Auto-generated by Loom.  Pin via .loomignore to customise.
[project]
name = "notify"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "pydantic>=2.10,<3",
  "uuid6>=2024.7.10",
  "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "redis>=5.2,<7",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
]

# Application project, not a distributable package — uv installs the
# dependency set without building/installing the project itself.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

# E741: DSL-authored lambda params (idiomatically `l` for lines) flow
# into the generated source verbatim.  E711/E712: DSL equality against
# null/true renders structurally — and in SQLAlchemy predicates
# `== True` / `!= None` are the operator-overloaded forms, not style
# slips.
[tool.ruff.lint]
# Pin the rule set to ruff's long-standing default families (pycodestyle
# errors E4/E7/E9 + Pyflakes F).  ruff 0.16 EXPANDED its implicit default
# to also enable isort (I), flake8-blind-except (BLE), pyupgrade (UP) and
# RUF rules — which flag generated-code idioms (import grouping, the broad
# `except Exception` boot/migrate guards, PEP-695 generic opinions) and
# red-lined the whole Python backend on a linter bump alone.  An explicit
# `select` freezes the scope the emitter's output is designed against, so a
# future ruff default expansion can't silently break generated projects.
select = ["E4", "E7", "E9", "F"]
ignore = ["E711", "E712", "E741"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
