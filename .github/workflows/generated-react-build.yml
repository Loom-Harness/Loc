name: Generated React TSX build

# For each {example .ddd × design pack@version} cell, generate the React
# project, `npm install`, and `tsc --noEmit` it.  Catches generator
# drift that compiles the TS backend cleanly but breaks the generated
# TSX (missing imports, wrong prop types, JSX namespace issues) —
# invisible to the IR-level tests but breaks at user time.
#
# Case policy:
#
#   - `pull_request` and       →  slice: showcase.ddd and
#     `merge_group`                subform-showcase.ddd × two
#                                  representative packs (see the
#                                  `build` step for why those).  The
#                                  queue runs the slice too: what it exists
#                                  to catch is two PRs green apart and red
#                                  together, and pack drift from an
#                                  unrelated PR is rare and cheap to fix.
#
#   - nightly `schedule` /      →  full Cartesian —
#     `workflow_dispatch`          the regression net for per-example and
#                                  per-pack drift.  `workflow_dispatch`
#                                  forces it on a branch when a slim cell
#                                  smelled suspicious.
#
# One job runs every selected cell, PARALLELISM (the runner's cores) at a
# time, plus the extern-component gate.  The checkout, `npm ci` and
# toolchain build are paid once per run.  The selected cells are the
# `LOOM_REACT_BUILD_CASE` value below — a `;`-joined list of
# `<ddd>[:<pack>[,<pack>…]]` specs, or empty for every example × every pack
# (test/e2e/react-build-cases.ts is the only list of either).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'src/**'
      - 'designs/**'
      - 'examples/**'
      - 'web/src/examples/**'
      - 'vite/**'
      - 'api/**'
      - 'docker/**'
      - 'test/e2e/generated-react-build.test.ts'
      - 'test/e2e/support/npm-install.ts'
      - 'test/e2e/support/parallel.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'langium-config.json'
      - '.github/workflows/generated-react-build.yml'
      # A change confined to a non-React backend cannot alter the React
      # bundle — skip this gate per-PR when only that code changed.  The
      # nightly sweep keeps the broad net on main.
      - '!src/generator/java/**'
      - '!src/generator/dotnet/**'
      - '!src/generator/python/**'
      - '!src/generator/elixir/**'
      - '!src/platform/java.ts'
      - '!src/platform/dotnet.ts'
      - '!src/platform/dotnet/**'
      - '!src/platform/python.ts'
      - '!src/platform/elixir.ts'
      - '!src/platform/hono/**'
      - '!src/platform/hono.ts'
  workflow_dispatch:
  merge_group:
  # The full example × pack sweep runs nightly on main; PRs and the merge
  # queue run the slice (see the header).
  schedule:
    - cron: '43 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Draft PRs run only the fast lane (test.yml, langium-generated, workflow-lint,
    # pr-gate); this and the rest of the fan-out fire when the PR is marked ready
    # for review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The nightly full sweep is ~160 cells at ~60-90 s each, PARALLELISM at
    # a time; the PR / queue slice is 4 cells.
    timeout-minutes: 90
    name: react build (selected examples × packs)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Restore the last toolchain build (incremental tsc)
        uses: ./.github/actions/restore-loom-build
      # Root install runs the `prepare` lifecycle (langium:generate + build).
      - name: Install Loom toolchain
        run: npm ci

      - name: tsc + vite build every selected cell
        env:
          # PR / merge queue: showcase.ddd (the feature-comprehensive
          # cross-generator conformance fixture) and subform-showcase.ddd
          # (the only array-of-value-object form — the per-pack
          # `field-input-array.hbs` renderer) × one Mantine and one shadcn
          # pack.  Nightly / dispatch: empty = every example × every pack.
          LOOM_REACT_BUILD_CASE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'examples/showcase.ddd:mantine@v9,shadcn@v4;web/src/examples/subform-showcase.ddd:mantine@v9,shadcn@v4' || '' }}
          LOOM_REACT_BUILD: "1"
        run: npx vitest run test/e2e/generated-react-build.test.ts

      # Extern-component escape-hatch gate: generate a project with an
      # `extern` component, drop in a hand-written widget, install +
      # `tsc --noEmit`, and prove the typed props contract bites — a correct
      # widget compiles, a field-mismatch one fails.
      - name: extern component props contract
        if: ${{ !cancelled() }}
        run: npm run test:tsc-react-extern

  # ── Merge-queue / branch-protection rollup ────────────────────────────
  # One stable check name for this workflow.  The jobs above are a matrix
  # (or a fan-out), so their check names are dynamic and cannot be named as
  # a required status check; this job can.  A skipped need counts as OK — a
  # label-guarded or path-skipped job is a legitimate no-op.  Kept honest by
  # test/system/merge-queue-readiness.test.ts; see docs/ci-gating.md.
  generated-react-build-passed:
    name: generated-react-build-passed
    # `!cancelled()`, not `always()`: when a newer push supersedes this run,
    # cancel-in-progress cancels the needed jobs — always() would then wake
    # this rollup later and convert the quiet supersession into a spurious
    # FAILURE check on the stale SHA (webhook noise for anyone babysitting
    # the PR). !cancelled() skips the rollup with the run; a LONE cancelled
    # need on a live run (a job timeout) still fails via the step below —
    # that is the "cancelled reads as not-failed" trap, kept closed. Same
    # pattern as test.yml's tests-passed.
    if: ${{ !cancelled() }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: fail if any needed job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
