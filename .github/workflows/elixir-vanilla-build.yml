name: Elixir / Vanilla build verification

# For every fixture under `test/e2e/fixtures/elixir-vanilla-build/`,
# generate the project then `mix deps.get && mix compile
# --warnings-as-errors` inside the hexpm/elixir Docker image.  This is
# the acceptance gate for the `foundation: vanilla` emit subtree —
# Slice 6 of https://github.com/Loom-Harness/Loc/blob/cadbe3ba12fb833565704cb9d628c8f41b2090a8/docs/old/plans/vanilla-foundation-tdd-plan.md.  Catches every
# Elixir-side error the unit-test string-assertion layer can't see.
#
# The generate + compile loop lives in
# `test/e2e/generated-elixir-vanilla-build.test.ts` (entrypoint:
# `npm run test:phoenix`).  One job builds every fixture,
# PARALLELISM (the runner's cores) at a time; each distinct dependency set is
# fetched and compiled once into a template that every project starts from
# (test/e2e/support/mix-workspace.ts), so a fixture costs its own compile and
# suite rather than a cold `mix deps.get` + dependency build.  Sharded one
# fixture per job, that setup (toolchain install, image pull, dependency
# build) was repeated for every fixture for well under a minute of real work.

# Triggers:
#   - PRs that touch the vanilla generator subtree, the fixtures, or
#     the test.
#   - Pushes to main.
#   - Manual dispatch.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/elixir/**'
      - 'src/generator/_api/**'
      - 'src/generator/_expr/**'
      - 'src/generator/_imports/**'
      - 'src/generator/_frontend/**'
      - 'src/generator/_openapi/**'
      - 'src/platform/elixir.ts'
      # Shared emission seams the platform tree above delegates into: `_stmt` is
      # the StmtIR dispatcher this backend's leaf table plugs into, `_payload`
      # the one tagged-union wire shape, `_i18n` the validation-catalog
      # collector.  The leading underscore means SHARED, not per-target -- a
      # change confined to one of them changes what this gate compiles.  Derived
      # from this block's platform claim and pinned by
      # test/system/workflow-path-coverage.test.ts.
      - 'src/generator/_adapters/**'
      - 'src/generator/_api/**'
      - 'src/generator/_auth/**'
      - 'src/generator/_channels/**'
      - 'src/generator/_docker/**'
      - 'src/generator/_i18n/**'
      - 'src/generator/_numeric/**'
      - 'src/generator/_obs/**'
      - 'src/generator/_openapi/**'
      - 'src/generator/_packs/**'
      - 'src/generator/_payload/**'
      - 'src/generator/_persistence/**'
      - 'src/generator/_stmt/**'
      - 'src/generator/_test/**'
      - 'src/generator/_trace/**'
      - 'src/generator/_walker/**'
      - 'src/generator/_workflow/**'
      - 'test/e2e/fixtures/elixir-vanilla-build/**'
      - 'test/e2e/generated-elixir-vanilla-build.test.ts'
      - 'test/e2e/support/hex-mirror.ts'
      - 'test/e2e/support/mix-retry.ts'
      - 'test/e2e/support/mix-workspace.ts'
      - 'test/e2e/support/npm-install.ts'
      - 'test/e2e/support/parallel.ts'
      - 'package.json'
      - '.github/workflows/elixir-vanilla-build.yml'
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every fixture in one job — see the header.  The fixture list is read from
  # the directory inside the test, so adding a `.ddd` needs no workflow edit.
  build-generated-elixir-vanilla:
    # Draft PRs run only the fast lane (test.yml, langium-generated, workflow-lint,
    # pr-gate); this and the rest of the fan-out fire when the PR is marked ready
    # for review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: elixir vanilla build (every fixture)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # Docker Hub pulls flake: a registry timeout (Client.Timeout on
      # registry-1.docker.io) killed an otherwise-green run with exit 125
      # before any compile ran. Pre-pull with backoff so a transient hiccup
      # costs seconds, not the run. The tag is grepped from the support module
      # that pins it — the single source of truth — so a bump cannot drift.
      - name: Pre-pull the hexpm/elixir image (retries)
        run: |
          IMG=$(grep -ohE 'hexpm/elixir:[A-Za-z0-9._-]+' test/e2e/support/mix-workspace.ts | head -1)
          echo "pre-pulling $IMG"
          for i in 1 2 3 4; do
            docker pull "$IMG" && exit 0
            echo "pull failed (attempt $i), retrying in $((i*10))s"; sleep $((i*10))
          done
          exit 1

      - name: Restore the last toolchain build (incremental tsc)
        uses: ./.github/actions/restore-loom-build
      # `npm ci` runs the `prepare` lifecycle (langium:generate + build); the
      # toolchain compiles before any test step needs it.
      - name: Install Loom toolchain
        run: npm ci

      - name: mix compile + mix test every vanilla fixture
        run: npm run test:phoenix

      - name: Surface failure context
        if: failure()
        run: |
          echo "## Elixir / Vanilla mix compile failed" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'The vitest report above names each failing fixture and carries its captured `mix compile --warnings-as-errors` / `mix test` / SPA build output.' >> $GITHUB_STEP_SUMMARY
          echo 'Reproduce one fixture locally: `LOOM_PHOENIX_VANILLA_BUILD=1 LOOM_PHOENIX_VANILLA_BUILD_CASE=<fixture>.ddd npx vitest run test/e2e/generated-elixir-vanilla-build.test.ts` (add LOOM_HEX_MIRROR=1 behind a TLS-fingerprinting proxy).' >> $GITHUB_STEP_SUMMARY

  # ── Merge-queue / branch-protection rollup ────────────────────────────
  # One stable check name for this workflow.  The jobs above are a matrix
  # (or a fan-out), so their check names are dynamic and cannot be named as
  # a required status check; this job can.  A skipped need counts as OK — a
  # label-guarded or path-skipped job is a legitimate no-op.  Kept honest by
  # test/system/merge-queue-readiness.test.ts; see docs/ci-gating.md.
  elixir-vanilla-build-passed:
    name: elixir-vanilla-build-passed
    # `!cancelled()`, not `always()`: when a newer push supersedes this run,
    # cancel-in-progress cancels the needed jobs — always() would then wake
    # this rollup later and convert the quiet supersession into a spurious
    # FAILURE check on the stale SHA (webhook noise for anyone babysitting
    # the PR). !cancelled() skips the rollup with the run; a LONE cancelled
    # need on a live run (a job timeout) still fails via the step below —
    # that is the "cancelled reads as not-failed" trap, kept closed. Same
    # pattern as test.yml's tests-passed.
    if: ${{ !cancelled() }}
    needs: [build-generated-elixir-vanilla]
    runs-on: ubuntu-latest
    steps:
      - name: fail if any needed job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
