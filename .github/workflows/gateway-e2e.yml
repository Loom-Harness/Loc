name: Gateway (runtime e2e)

# Boots the generated docker-compose stack of a `gateway` over six frontends
# (React at the root; Vue, Svelte, Angular, Feliz and Flutter under their own
# paths) sharing one node backend, and drives it through the gateway: `/api` reaches the
# backend, every part and every asset it references loads under its own path,
# and in Chromium each part renders a deep link, reads the backend through the
# gateway and navigates within its path.
#
# Builds each image from the emitted Dockerfile, so it needs no host toolchain
# beyond docker + compose and the Playwright Chromium.
on:
  # Nightly run on main: this leg is not in the merge queue, so the nightly
  # run is what checks it against the combined tree (docs/ci-gating.md,
  # "Post-merge net").
  schedule:
    - cron: '41 3 * * *'
  # Per-PR proof on the gateway emitters, the base-path plumbing of the
  # frontends, and the pipeline phases every emitter rides.  The
  # generic phase paths are pinned by test/system/workflow-path-coverage.test.ts.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/platform/gateway.ts'
      - 'src/platform/web.ts'
      - 'src/generator/react/from-contract.ts'
      - 'src/generator/vue/from-contract.ts'
      - 'src/generator/svelte/from-contract.ts'
      - 'src/generator/angular/from-contract.ts'
      - 'src/generator/feliz/from-contract.ts'
      - 'src/generator/flutter/from-contract.ts'
      - 'src/generator/_frontend/static-nginx.ts'
      - 'src/generator/_walker/**'
      - 'designs/**'
      - 'sveltekit/**'
      - 'vue/**'
      - 'angular/**'
      - 'test/e2e/gateway-compose-e2e.test.ts'
      - '.github/workflows/gateway-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-e2e:
    # Draft PRs run only the fast lane (test.yml, langium-generated, workflow-lint,
    # pr-gate); this and the rest of the fan-out fire when the PR is marked ready
    # for review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Eight image builds (six bundles, the backend, nginx) dominate; the
    # Flutter SDK image is the largest pull.
    timeout-minutes: 60
    name: gateway-e2e
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore the last toolchain build (incremental tsc)
        uses: ./.github/actions/restore-loom-build
      - name: Install Loom toolchain
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run gateway e2e
        run: npm run test:gateway-e2e -- --reporter=verbose

      - name: Surface failure context
        if: failure()
        run: |
          echo "## Gateway e2e failed" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'A gateway served four frontends and their backend on one origin; the run step above has the failing route or page and, when boot failed, the compose logs.' >> $GITHUB_STEP_SUMMARY
