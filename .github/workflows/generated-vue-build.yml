name: Generated Vue build

# For each {case × vue pack} cell, generate the Vue project,
# `npm install`, `vue-tsc --noEmit`, and `vite build` it.  The Vue
# analogue of generated-react-build.yml — catches generator/pack
# drift invisible to the IR-level tests (vue-frontend-plan.md
# Slice 9).
#
# One job runs the selected cases, PARALLELISM (the runner's cores) at a
# time.  Case policy:
#   - pull_request,   → the scaffold, showcase, store and grid cases × both
#     merge_group       packs.  `scaffold` is the only case that type-checks a
#                       SCAFFOLDED FORM (the 2026-09-10 e-shop audit measured
#                       `vue-tsc` red on every form-binding shape a real model
#                       carries), and `grid`'s DataGrid markup lands in a
#                       HOISTED SIBLING SFC (src/components/<Name>.vue) no other
#                       case type-checks.  `minimal`/`file` drift is caught by
#                       the nightly full sweep.
#   - nightly,        → every case × every pack.
#     workflow_dispatch
#
# Case names are the `name`s in test/e2e/generated-vue-build.test.ts.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'src/**'
      - 'designs/vuetify/**'
      - 'designs/shadcnVue/**'
      - 'examples/vue-showcase.ddd'
      - 'web/src/examples/vue-store-showcase.ddd'
      - 'vue/**'
      - 'api/**'
      - 'docker/**'
      - 'stacks/vue1/**'
      - 'test/e2e/generated-vue-build.test.ts'
      - 'test/e2e/support/npm-install.ts'
      - 'test/e2e/support/parallel.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'langium-config.json'
      - '.github/workflows/generated-vue-build.yml'
      # A change confined to a non-Vue backend cannot alter the Vue bundle —
      # skip this gate per-PR when only that code changed.  The push:main
      # trigger above keeps the broad `src/**` net post-merge.
      - '!src/generator/java/**'
      - '!src/generator/dotnet/**'
      - '!src/generator/python/**'
      - '!src/generator/elixir/**'
      - '!src/platform/java.ts'
      - '!src/platform/dotnet.ts'
      - '!src/platform/dotnet/**'
      - '!src/platform/python.ts'
      - '!src/platform/elixir.ts'
      - '!src/platform/hono/**'
      - '!src/platform/hono.ts'
  workflow_dispatch:
  merge_group:
  # The full case × pack sweep runs nightly on main; PRs and the merge queue
  # run the slice (see the header).
  schedule:
    - cron: '28 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Draft PRs run only the fast lane (test.yml, langium-generated, workflow-lint,
    # pr-gate); this and the rest of the fan-out fire when the PR is marked ready
    # for review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: vue build (selected cases × packs)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Restore the last toolchain build (incremental tsc)
        uses: ./.github/actions/restore-loom-build
      # Root install runs the `prepare` lifecycle (langium:generate + build).
      - name: Install Loom toolchain
        run: npm ci

      - name: vue-tsc + vite build every selected case
        env:
          # Empty selects every case (see the header for the PR slice).
          LOOM_VUE_BUILD_CASE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'scaffold,showcase,store,grid' || '' }}
        run: npm run test:vue-build

  # ── Merge-queue / branch-protection rollup ────────────────────────────
  # One stable check name for this workflow.  The jobs above are a matrix
  # (or a fan-out), so their check names are dynamic and cannot be named as
  # a required status check; this job can.  A skipped need counts as OK — a
  # label-guarded or path-skipped job is a legitimate no-op.  Kept honest by
  # test/system/merge-queue-readiness.test.ts; see docs/ci-gating.md.
  generated-vue-build-passed:
    name: generated-vue-build-passed
    # `!cancelled()`, not `always()`: when a newer push supersedes this run,
    # cancel-in-progress cancels the needed jobs — always() would then wake
    # this rollup later and convert the quiet supersession into a spurious
    # FAILURE check on the stale SHA (webhook noise for anyone babysitting
    # the PR). !cancelled() skips the rollup with the run; a LONE cancelled
    # need on a live run (a job timeout) still fails via the step below —
    # that is the "cancelled reads as not-failed" trap, kept closed. Same
    # pattern as test.yml's tests-passed.
    if: ${{ !cancelled() }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: fail if any needed job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
