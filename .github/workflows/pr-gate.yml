name: PR gate

# The per-PR aggregate verdict — see docs/ci-gating.md → "The `pr-gate` check".
# Built when this repo was under a personal account and a merge queue was not
# available; the queue is on now, and this stays as the ENTRY bar: it gates
# your branch in seconds so a red PR never spends a queue slot and a full
# heavy run before being ejected.
#
# v2 — EVENT-DRIVEN.  v1 was one long-polling job that waited (up to 80min)
# for every other check while itself holding a runner slot; under load the
# parked gates starved the jobs they were waiting for and timed out.  v2 runs
# a seconds-long EVALUATION on every completion event instead:
#
#   * `pull_request` events start the cycle (and re-arm it on `labeled` /
#     `ready_for_review`, whose fan-outs add new checks to wait for);
#   * `workflow_run: completed` of every other workflow re-evaluates — the
#     LAST workflow to finish triggers the final, green evaluation.  It does
#     so LATE under load: the per-SHA concurrency group serialises
#     evaluations, so a burst of ~40 completions advances the verdict about
#     twice, not forty times.  Measured 2026-09-10, last-check-green to
#     `pr-gate`-terminal was 14m18s (#2846) and 11m48s (#2847).
#
# Each evaluation posts a check run named `pr-gate` on the head SHA via the
# Checks API (checks: write): failure with culprits named, `in_progress`
# while others still run (blocks merge without claiming failure), success
# when everything triggered has passed.  That API-posted check — not this
# job's own — is what branch protection requires: workflow_run-triggered
# jobs don't surface in the PR checks UI, so the job is `pr-gate-eval` and
# the canonical `pr-gate` name comes from the posted check on every path.
#
# No polling, no timeout to tune, no parked slot.  A re-run of a red check does
# fire `workflow_run: completed` again — but that is NOT enough to recover a
# parked gate; see the lever table under `schedule:` below.
#
# The `workflows:` list below must name every other workflow (else a gate's
# completion stops re-evaluating and a PR can stick at in_progress until the
# next event) — pinned complete by test/system/pr-gate.test.ts.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  # The queue needs this arm for the same reason branch protection needs the
  # check.  `pr-gate` is REQUIRED on `main`, and GitHub applies ONE required-
  # checks list to a pull request and to a merge group alike — there is no
  # per-context list to leave it out of.  A required check with no
  # `merge_group:` trigger is therefore never posted inside the queue, and
  # GitHub waits for it forever: exactly the failure
  # `merge-queue-required-checks.ts` names in its invariants ("a required check
  # that never runs there leaves the queue pending forever").  That is what
  # stalled the first entries once the queue went live — they formed, ran their
  # whole sweep, and then sat with zero runs left, waiting on this check.
  merge_group:
    types: [checks_requested]
  # The safety net.  It re-derives every OPEN PR's verdict and posts only where
  # it differs.
  #
  # MEASUREMENT TRAP, and it invalidates the claim this comment used to open
  # with ("GitHub drops dispatches — #2464, 08:42Z").  A `workflow_run`-
  # triggered run is attributed to the repository's DEFAULT BRANCH, so listing
  # this workflow's runs filtered to a PR branch returns ONLY the one
  # `pull_request`-event run, and the eval job's check run lands on `main`'s
  # SHA rather than the SHA it evaluated.  Measured 2026-09-10: of the 100 most
  # recent runs here, all 91 that were `event=workflow_run` carry
  # `head_branch: main`.  Neither view can tell "no evaluation fired" from
  # "evaluations fired and are invisible here", so no filtered count is
  # evidence of a dropped dispatch.  What IS observed is a green PR whose
  # published verdict stays non-terminal long after its last check finished;
  # cause undiagnosed, and the net is worth having either way.  To count
  # evaluations, list this workflow's runs UNFILTERED and read `event`.
  #
  # It does NOT cap that outage at one cron interval, and this comment used to
  # claim it did.  GitHub runs this schedule far slower than asked: re-measured
  # 2026-09-10, the 30 most recent `schedule` runs of this workflow span
  # 100.9 HOURS — mean gap 3.48 h, median 3.49 h, shortest gap anywhere in that
  # window 91 min.  Not one 15-minute gap in 29.  FIVE of those 30 are
  # `failure`, not late (2026-09-09T21:55Z to 2026-09-10T13:37Z — the window in
  # which the scheduled sweep collided with its own job-level concurrency
  # group, #2835, fixed in #2846), so the idle backstop was absent, not slow,
  # for those ~16 hours.  Actions cron is best-effort, and a high-frequency
  # schedule on a busy account is heavily deprioritised: the cron below is a
  # request, not a guarantee.  (Re-measure before trusting either figure — list
  # this workflow's runs filtered to `event=schedule` and diff `created_at`.)
  #
  # So a park lasts HOURS, not minutes, if the sweep is what has to clear it.
  # If you are waiting on a parked `pr-gate`, do not wait for the sweep.  THREE
  # levers have been measured, and they do not all work:
  #
  #   a new SHA        WORKS.  Measured on #2812 (2026-09-08): parked on
  #                    `5e0995d`, unparked the moment `027454e` was pushed.
  #   re-run THIS      WORKS.  Measured on #2773 (2026-09-09, 15:57Z): the
  #   workflow's own   `pull_request`-event `PR gate` run for the parked head
  #   run              (34356460700) re-run by hand; the PR entered the merge
  #                    queue ~3 minutes later.  This is the cheap one — it
  #                    re-evaluates the same SHA and costs no other CI.
  #   re-run the RED   DOES NOT.  Measured three times — #2812, #2792, and
  #   check's workflow #2773 after the cancellation fix below.
  #                    `rerun_workflow_run` returns 201 and the dispatch does
  #                    fire, but no verdict reaches the head SHA and the merge
  #                    stays refused with
  #                    `Required status check "pr-gate" is expected`.
  #
  # This comment used to offer the first two as interchangeable, and then to
  # know only the first.  The difference costs hours: on a red-check re-run you
  # wait, conclude it worked, and find the PR still unmergeable.
  #
  # The suspected cause used to be named here as the SHA-keyed
  # `cancel-in-progress: true` on the `concurrency` block at the bottom of this
  # file.  It was verified (94 of 100 `workflow_run` evaluations cancelled, zero
  # published) and FIXED in #2822 — nothing cancels a RUNNING evaluation now.
  # Cancellations did not go to zero and were never going to (66 of 91 on
  # 2026-09-10, with 20 successes): GitHub still cancels a superseded PENDING
  # run, which is the serialisation working.  See that block.
  #
  # The red-check re-run hole SURVIVED that fix, and is NOT explained by it.
  # Measured on #2773: the last two red checks were re-run to green at 14:33Z
  # and 14:41Z, every check on the head was then success or skipped, and the
  # gate was still blocking at 15:57Z — 76 minutes with no verdict and no sweep.
  # Re-running this workflow's own run cleared it immediately.  So the mechanism
  # is still undiagnosed; what is established is which lever to reach for.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  workflow_run:
    types: [completed]
    # `push: main` completions (a ~60-workflow heavy set per merge) used to
    # create a skipped eval run EACH — a dispatch storm this gate has no reason
    # to carry.  (It used to be described here as "the storm that got real
    # events dropped"; that attribution is retired with the rest — see the
    # measurement trap under `schedule:` above.)  Filtering by the triggering
    # run's head branch stops those runs from being created at all, and that is
    # why `main` is still ignored.
    #
    # Merge-queue refs are NOT ignored, and must not be.  The `merge_group:`
    # arm above posts one evaluation when the group FORMS, at which point every
    # other check is still pending — so without completions from inside the
    # group there is nothing to move that verdict off `in_progress`, and the
    # gate parks precisely where it parked before.  The cost is bounded in a way
    # the `main` case was not: the queue runs one group at a time, each
    # evaluation is seconds long, and the SHA-keyed concurrency below collapses
    # a burst of completions to the newest.
    branches-ignore:
      - main
    workflows:
      - 'API call (typed in-system call runtime e2e)'
      - 'OIDC auth (full-compose runtime e2e)'
      - 'Behavioral e2e — .NET (persistence: dapper)'
      - 'Behavioral e2e — .NET (ASP.NET + EF Core)'
      - 'Behavioral e2e — Elixir (plain Ecto/Phoenix)'
      - 'Behavioral e2e — Java (Spring Boot + JPA)'
      - 'Behavioral e2e — node/Hono (MikroORM)'
      - 'Behavioral e2e — Python (FastAPI)'
      - 'Behavioral e2e (headless, no docker)'
      - 'Behavioral UI e2e (headless, no docker)'
      - 'Behavioral UI e2e — HEEx / LiveView'
      - 'Channels (broker runtime e2e)'
      - 'main-red alarm'
      - 'Cleanup old workflow artifacts'
      - 'Conformance full (nightly)'
      - 'Conformance parity (per-PR)'
      - 'Context integration (runtime e2e)'
      - 'Corpus compile gates'
      - 'Corpus compile gate (Elixir)'
      - 'Cross-backend response differential (report-only)'
      - '.NET build verification'
      - '.NET observability events (runtime e2e)'
      - '.NET OIDC auth (runtime e2e)'
      - 'OIDC auth — Elixir/Phoenix (full-compose runtime e2e)'
      - 'Elixir / Vanilla build verification'
      - 'Elixir / Vanilla runtime e2e (observability)'
      - 'Elixir / Vanilla VO wire round-trip (runtime e2e)'
      - 'Mailer smtp (runtime e2e)'
      # Never runs on a PR SHA (schedule/dispatch only), so it never appears in
      # a PR's checks — listed to satisfy the completeness ratchet, which is
      # deliberately mechanical rather than a judgement call per workflow.
      - 'Flake budget (per-leg pass rates)'
      - 'Frontend full-stack e2e (nightly, no docker)'
      - 'Generated a11y (axe-core)'
      - 'Generated Angular build'
      - 'Generated Angular e2e'
      - 'Generated Feliz build'
      - 'Generated Flutter build'
      - 'Generated React TSX build'
      - 'Generated React e2e'
      - 'Generated Svelte build'
      - 'Generated Svelte e2e'
      - 'Generated Vue build'
      - 'Generated Vue e2e'
      - 'TypeScript (Hono) build verification'
      - 'Hono observability events (runtime e2e)'
      - 'Hono OIDC auth (runtime e2e)'
      - 'Java build verification'
      - 'Java observability e2e'
      - 'Java OIDC auth (runtime e2e)'
      - 'Kubernetes/Helm validation'
      - 'Kubernetes cluster e2e (kind)'
      - 'Langium generated files in sync'
      - 'Migration evolution (runtime e2e)'
      - 'Deploy landing page + playground to GitHub Pages'
      - 'Pairwise combination corpus'
      - 'Phoenix / LiveView UI smoke (runtime e2e)'
      - 'Playground e2e (no-network)'
      - 'Playground e2e'
      - 'Playground worker-realm check'
      - 'Python build verification'
      - 'Python observability e2e'
      - 'Python OIDC auth (runtime e2e)'
      - 'Schema load (emitted DDL)'
      - 'Schemathesis contract fuzzing'
      - 'Tenancy isolation (runtime e2e)'
      - 'Tests + coverage'
      - 'Lint GitHub Actions workflows'
      - 'Quality delta (weekly)'

permissions:
  checks: write
  contents: read
  # Sweep mode lists open PRs to reconcile their verdicts.
  pull-requests: read

# NOTHING here cancels a RUNNING evaluation.  Runs are grouped per evaluated
# SHA (and all sweeps share one key), and GitHub serialises each group at one
# running + one pending — which is the property this gate needs on EVERY path,
# not just the sweep's.
#
# Cancellations therefore do NOT go to zero, and a reader who expects that will
# misread the run list.  GitHub cancels the previously PENDING run whenever a
# newer one joins the group, so under a completion storm most evaluations for a
# SHA are cancelled before they start: measured 2026-09-10, of the 100 most
# recent runs here the 91 `event=workflow_run` ones were 66 cancelled,
# 20 success, 5 queued.  That is the design working — the newest queued run
# always survives and publishes — and it is also why the verdict lags: a SHA's
# verdict advances about twice per storm, not once per completion (14m18s on
# #2846, 11m48s on #2847, from last check completing to `pr-gate` terminal).
#
# This block used to read `cancel-in-progress: <true for the SHA-keyed events>`,
# on the theory that a burst of completions should "collapse to the newest
# evaluation".  Measured 2026-09-08, it collapsed to NOTHING: of the last 100
# `workflow_run`-triggered runs, 94 were `cancelled`, 4 queued, 2 pending, and
# ZERO succeeded.  An evaluation takes ~2m20s but sits QUEUED far longer while
# the pool is busy, so the next completing check superseded it before it ever
# reached `publishCheck`.  With ~40 checks feeding one SHA-keyed group — and
# three such groups at once while a merge queue batch runs — the stream never
# ended and no verdict was ever published.  Every parked gate that day traces
# here: PR heads stuck at `in_progress`, merge-queue entries ejected green, and
# the two "recoveries" that did work (a NEW SHA, a RE-RUN) working only because
# each is a single event with no burst behind it to cancel it.
#
# Cancellation buys nothing anyway.  A pending run costs no runner; it is the
# CANCELLED ones that waste the slot they had already claimed.  Serialising
# keeps at most two evaluations per SHA, the in-flight one always publishes, and
# the newest queued one always runs after it.
#
# The two properties this block must keep, both pinned by
# `test/system/pr-gate.test.ts`:
#
#   * `group` — a `schedule` / `workflow_dispatch` payload has neither
#     `pull_request` nor `workflow_run`, so without the literal fallback the key
#     degenerates to `pr-gate-` and every sweep shares one group.  The `no-sha`
#     literal keeps those runs in their own group, clear of the SHA-keyed ones —
#     and, now that nothing cancels, serialises them rather than killing them.
#     (Observed on #2443 under the old setting: checks green at 22:07Z, sweeps
#     at 21:20Z and 22:08Z both cancelled, gate parked at `in_progress`.)
#
#     The literal must NOT be `sweep`.  It was, from #2835 until #2846, and that
#     made this key resolve to `pr-gate-sweep` on exactly the SHA-less events —
#     the same string as the sweep JOB's own group below.  A job cannot take a
#     concurrency group its own workflow run already holds, so every scheduled
#     sweep died instantly: 0 steps, no logs, `completed_at` BEFORE `started_at`.
#     Measured on the four schedule runs from 2026-09-09T21:55Z to 09-10T09:05Z,
#     all `failure`, against 19 `workflow_run` sweeps over the same window that
#     all SUCCEEDED — those resolve this key to `pr-gate-<head_sha>`, so they
#     never collided.  The safety net was dead for the 11 hours in between, and
#     #2674 sat with no verdict at all the whole time.  `pr-gate.test.ts` pins
#     the two names apart.
#
#   * `cancel-in-progress` — FALSE, unconditionally.  Making the key unique per
#     run would also stop the cancelling, but it lets runs OVERLAP, and two
#     concurrent evaluations of one SHA race: the slower one posts its older
#     verdict last and can re-park a PR it already greened.  Never lose the
#     newest, never kill the in-flight one.
concurrency:
  group: pr-gate-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.event.merge_group.head_sha || 'no-sha' }}
  cancel-in-progress: false

jobs:
  pr-gate-eval:
    name: pr-gate-eval
    # Runs wherever there is ONE SHA to evaluate: a `pull_request` or
    # `merge_group` event directly, or a `workflow_run` completion from a run
    # that was itself triggered by one of those.
    #
    # `schedule` / `workflow_dispatch` deliberately fall through to `sweep`
    # below.  They carry no SHA, so this job would run in sweep mode — which is
    # what it used to do, and why the guard here was once written inverted
    # (`event_name != 'workflow_run' || …`).  The sweep is its own job now,
    # because it needs a throttle and a concurrency group this one must not
    # have; running it in both places would only sweep twice.
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'merge_group'
      || (github.event_name == 'workflow_run'
      && (github.event.workflow_run.event == 'pull_request'
      || github.event.workflow_run.event == 'merge_group'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Evaluate all checks on this SHA and post the pr-gate verdict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.event.merge_group.head_sha }}
        run: node scripts/pr-gate.mjs

  # ---------------------------------------------------------------------------
  # The safety net, moved off the CLOCK and onto REPO ACTIVITY.
  #
  # `sweep` re-derives every open PR's verdict and posts only where it
  # disagrees with what is already on the SHA (`sweepShouldPost`).  It exists
  # because the event-driven path has no self-correction: whatever the reason a
  # SHA stops receiving evaluations, nothing else re-derives its verdict and a
  # fully green PR sits at `in_progress` until a human pokes it.
  #
  # Observed on #2819, 2026-09-09: every one of its 241 checks green or skipped
  # and the gate still blocking.  Re-verified 2026-09-10 from that head's
  # check-run record — the next evaluation VISIBLE on the head is a
  # `pull_request`-event `pr-gate-eval` at 06:34:59Z (a hand re-run), 46 minutes
  # after its last check completed at 05:49:10Z.  This comment used to add
  # "last evaluation created 05:48:26, none after ... so this was delivery, not
  # a missing name"; that is retired, because a `workflow_run` evaluation is
  # attributed to `main` and cannot be seen on a PR head at all (see the
  # measurement trap on the `workflow_run:` trigger above).  Park duration
  # measured, park CAUSE undiagnosed.
  #
  # The `schedule:` trigger was the only thing meant to catch that, and it does
  # not: the cron asks for four sweeps an hour and Actions delivers a mean gap
  # of 3.48 HOURS on this account (re-measured 2026-09-10 — see the comment on
  # the trigger).  So the sweep now also rides `workflow_run`, the one event
  # stream this repo produces both reliably and in volume — though under load
  # most sweep-eligible runs are cancelled as superseded pendings, so what it
  # delivers is ~1 sweep per 18 min, not ~4/hour.
  #
  # TWO independent brakes, because an unthrottled sweep would exhaust the
  # per-repository GITHUB_TOKEN budget — a sweep costs one call to list the
  # open PRs plus a paged check-run fetch per PR:
  #
  #   * `endsWith(run_number, '0')` — one sweep per ten evaluations.  It costs
  #     no API call to decide, it is deterministic, and it scales with
  #     activity, which is the right correlate: a park can only happen where
  #     events are flowing.  (GitHub expressions have no arithmetic, so this is
  #     a string test on the last digit, not a modulo.)
  #
  #     What it DELIVERS is well under what that arithmetic suggests, because a
  #     sweep-eligible run is as cancellable as any other.  Measured 2026-09-10
  #     under a fleet burst: 91 evaluations in 18.4 minutes (~300/h), of which
  #     10 were sweep-eligible and exactly ONE survived — the other nine were
  #     cancelled as superseded pending runs, taking their sweep job with them.
  #     ~1 delivered sweep per 18 minutes under load, not ~4/hour.
  #   * a CONSTANT concurrency group.  The workflow-level one is keyed per SHA,
  #     so it would let sweeps for different SHAs pile up; this one holds every
  #     sweep in a single group, which GitHub caps at one running plus one
  #     pending, cancelling a superseded pending.  A burst can never stack
  #     sweeps, and nothing that has started is ever cancelled.
  #
  # ITS REACH IS OPEN PRs ONLY.  `sweep()` enumerates `GET /pulls?state=open`,
  # and a head inside the merge QUEUE is not an open PR's head — so no sweep
  # ever reconciles a merge-group verdict.  In the queue, the event-driven path
  # (the `merge_group:` arm plus completions from inside the group) is the only
  # mechanism, and its only bound is the queue's checks timeout, which ejects
  # the entry rather than healing it.  That gap is known and unclosed.
  #
  # It never runs on `pull_request` or `merge_group`, so it never posts a check
  # run onto a SHA this gate evaluates.  On those events the job is SKIPPED,
  # and a skipped job still surfaces as a check run — which is why
  # `pr-gate-sweep` is in `SELF_NAMES`.
  # ---------------------------------------------------------------------------
  sweep:
    name: pr-gate-sweep
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run'
      && endsWith(format('{0}', github.run_number), '0'))
    concurrency:
      group: pr-gate-sweep
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # No HEAD_SHA — that is what selects sweep mode in scripts/pr-gate.mjs.
      - name: Reconcile every open PR's published verdict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-gate.mjs
