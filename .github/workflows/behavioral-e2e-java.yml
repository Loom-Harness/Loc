name: Behavioral e2e — Java (Spring Boot + JPA)

# RST-3 — the behavioral tier's FOURTH backend. The node tier
# (behavioral-e2e.yml) boots Hono in-process on PGlite; Java has no
# in-process Postgres, so this boots the GENERATED Java backend as a real
# process against a `services: postgres` sidecar and HTTP-dispatches the SAME
# emitted `test e2e` api suite at it (the emitted suite is backend-agnostic —
# written against the HTTP contract).
#
# This moves the *behavioral* runtime-semantics RS-rules
# (docs/conformance-semantics.md) onto a FOURTH backend per-PR: camelCase keys
# both directions (RS-1), enum declared casing (RS-2), no leaked columns
# (RS-3), temporal round-trip (RS-4), bool create default (RS-6), value-object
# survival (RS-7), association round-trip (RS-8). See
# docs/old/plans/runtime-semantics-tier-followups.md (RST-3).
#
# Reuses the proven boot recipe from java-obs-e2e.yml (gradle bootJar +
# java -jar against SPRING_DATASOURCE_URL) and the harness wiring from
# behavioral-e2e-dotnet.yml.
#
# COST MODEL — read this before adding a corpus fixture. (The BUDGET is a
# separate question with its own rule; see the `timeout-minutes` comment below
# and docs/ci-gating.md.)
#
# The leg is one flat per-case loop: `run-java.mjs` generates, builds, boots and
# tears down ONE Spring Boot app per behavioural case, so its runtime is simply
# (number of cases) x (per-case constant). Setup (checkout/node/java/gradle/
# npm ci) is ~1 min and does not grow; the tier step is ~93% of the job. Read
# off the step timestamps of run #2581 (main, 2026-09-10, 53 cases): job 15m35s,
# tier step 14m25s, and every case between 15.5s and 17.5s with NO outlier. So a
# slow leg here means "more cases" or "a slower per-case constant" — never one
# pathological fixture, and profiling a single case tells you about all of them.
#
# That constant was dominated by `gradle --no-daemon`: 53 cold Gradle JVMs,
# which did not even avoid the fork they name (the client heap does not meet the
# build requirement, so Gradle forks a single-use daemon anyway). `run-java.mjs`
# now builds on a warm daemon — the GRADLE_BASE comment there carries the
# back-to-back measurement: mean 11.7s -> 2.84s steady state per project build
# (~4.1x), i.e. ~8.9s off each case. On a quiet 4-core host the `--no-daemon`
# arm reproduces this leg's own 16.2s-per-case constant almost exactly (11.7s of
# build + ~4.5s of Spring Boot start, generate and dispatch), so the PROJECTION
# is ~7.3s per case: tier step 14m25s -> ~6.5 min, job ~7.5 min. That is a
# projection, not a reading — confirm it against the first green run's step
# timestamps, then re-derive the budget (see the `timeout-minutes` comment).
# After it, the per-case constant is BOOT-dominated, so the next real saving is
# on the app-start side rather than the build side.
#
# When the cases outgrow the budget again, SPLIT THE LEG rather than widening the
# cap further — but split it by DERIVING the shards from the same corpus manifest
# `cases.mjs` reads (e.g. index % N), never a hand-written shard list, or a new
# fixture named by no shard runs in neither half.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'web/src/testing/**'
      - 'test/behavioral/**'
      # The typed corpus manifest + its fixtures are this tier's CASE LIST:
      # `cases.mjs` derives every feature case from them, so a fixture that
      # grows a `test e2e`/`test` block mints a case (and needs a wire golden)
      # here.  Without this a pure-fixture PR fires none of the behavioural
      # legs — `corpus-build.yml` watches the same dir for the compile tier.
      - 'test/fixtures/corpus/**'
      # The cross-backend wire differential (M-T9.11): a change to the differ or
      # to the canonical goldens must re-verify THIS backend against them.
      - 'test/_helpers/wire-record.ts'
      - 'test/_helpers/wire-waivers.ts'
      - 'test/_helpers/response-diff.ts'
      - 'package.json'
      - '.github/workflows/behavioral-e2e-java.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/ir/**'
      - 'src/generator/java/**'
      - 'src/generator/_expr/**'
      - 'src/platform/java.ts'
      - 'web/src/testing/**'
      - 'test/behavioral/**'
      # The typed corpus manifest + its fixtures are this tier's CASE LIST:
      # `cases.mjs` derives every feature case from them, so a fixture that
      # grows a `test e2e`/`test` block mints a case (and needs a wire golden)
      # here.  Without this a pure-fixture PR fires none of the behavioural
      # legs — `corpus-build.yml` watches the same dir for the compile tier.
      - 'test/fixtures/corpus/**'
      # The cross-backend wire differential (M-T9.11): a change to the differ or
      # to the canonical goldens must re-verify THIS backend against them.
      - 'test/_helpers/wire-record.ts'
      - 'test/_helpers/wire-waivers.ts'
      - 'test/_helpers/response-diff.ts'
      - '.github/workflows/behavioral-e2e-java.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavioral-java:
    # Draft PRs run only the fast lane (test.yml, langium-generated, workflow-lint,
    # pr-gate); this and the rest of the fan-out fire when the PR is marked ready
    # for review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Budget per docs/ci-gating.md § "Sizing a job's `timeout-minutes`":
    # 50 % margin over the measured p95, rounded up to 5 min, floor 10.
    #
    # This leg was the reason that rule exists.  At 20m it killed 13 of the
    # ~74 runs that reached a verdict in the last 100 (~18 %), most recently on
    # 2026-09-10 — and because a killed run is not a successful one, its own
    # p95 (19m46s over n=40) is a LOWER BOUND: the cap deleted the tail it was
    # being measured against.  30m is sized to stop the censoring, not to be a
    # final answer; re-measure once the sample is uncensored and tighten.
    #
    # The deeper problem is that this leg is SLOW, not tight-budgeted: 17m56s
    # median in the test step against 6m–10m for every other backend leg,
    # because `run-java.mjs` pays a `gradle --no-daemon bootJar` — a cold JVM
    # and a full Spring compile — per corpus case, sequentially.  Its own
    # run-to-run spread is 13m02s–18m49s, a 5m47s swing that alone was 35x the
    # 10s of headroom the 20m cap left.  Splitting the leg instead would cost a
    # second slot out of a saturated ~20-slot pool AND need a shard manifest,
    # since `run-java.mjs` takes an explicit case list and a new corpus case
    # would otherwise run in neither half.
    #
    # THAT ROOT CAUSE IS NOW FIXED — `run-java.mjs` builds on a warm Gradle
    # daemon (mean 11.7s -> 2.84s per project build, measured back to back; see
    # the COST MODEL note at the top of this file), projecting the job at ~7.5m.
    # The budget deliberately stays at 30 anyway: the rule sizes from a RECORDED
    # p95 over >=10 runs, and the post-fix sample does not exist yet.  Re-run
    # `node test/behavioral/ci-budget-report.mjs` once it does and tighten then —
    # this should come down two or three steps.
    #
    # Measured 2026-09-10, n=40 successful runs: p95 19m46s, max 19m50s.
    # Re-derive with `node test/behavioral/ci-budget-report.mjs`.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Spring Boot's native datasource env vars. Point at the postgres sidecar
      # above (POSTGRES_DB: app).
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/app
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      # Java 25 toolchain needs Gradle 9.1+ (no wrapper is emitted).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      # Pre-warm the Gradle caches. Without this every run pays the full cold
      # dependency resolution. Key tracks the Java emitter's build source so a
      # dep-set change mints a fresh entry.
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-behavioral-${{ hashFiles('src/generator/java/emit/program.ts') }}
          restore-keys: |
            gradle-behavioral-

      - name: Install Loom toolchain
        run: npm ci

      - name: Build toolchain
        run: npm run build

      - name: Install behavioral harness deps
        working-directory: test/behavioral
        run: npm ci || npm install --no-audit --no-fund

      - name: Run Java behavioral tier (api gate, real Postgres)
        working-directory: test/behavioral
        run: node run-java.mjs
