name: Corpus compile gate (Elixir)

# The FIFTH backend cell of the per-feature corpus compile matrix (M-T9.10).
# corpus-build.yml compiles every corpus feature on tsc/dotnet/java/python but
# deliberately left Elixir out — it's the one backend that needs the docker
# hexpm image + (behind a TLS-fingerprinting egress proxy) the LOOM_HEX_MIRROR
# loopback CA dance, so it was "wired separately as a follow-up" (see that
# workflow's header).  This is that follow-up.
#
# Before this gate, every corpus feature's Elixir emission was generation-
# verified per-PR (corpus-coverage) but only COMPILE-checked in the nightly
# cross-backend conformance run — so an Elixir codegen regression on any corpus
# feature shipped green until the nightly.  This closes that silent gap: each
# feature's generated plain-Ecto/Phoenix project is `mix compile
# --warnings-as-errors`-checked inside the hexpm/elixir image, per PR.
#
# That compile is MIX_ENV=prod, which never reads `test/` — so the same cell
# then runs the project's emitted ExUnit suite (the elixir half of the
# fixture's `test` blocks) under `MIX_ENV=test mix test --warnings-as-errors`
# against the Postgres sidecar.  Known-failing suites are ratcheting entries
# in the test's ELIXIR_TEST_WAIVERS (a waived suite that passes fails as stale).
#
# The generate + compile loop lives in `test/e2e/corpus-elixir-build.test.ts`
# (entrypoint `npm run test:elixir-corpus`); the feature list is computed inside
# the test from the shared manifest (test/fixtures/corpus/manifest.ts, key
# `vanilla`) minus that backend's ELIXIR_COMPILE_SKIP map — one source of truth.
#
# One job runs every feature, PARALLELISM (the runner's cores) at a time.  The
# test builds each distinct dependency set ONCE into a template and starts
# every project from a copy of it, so a feature costs its own compile, migrate
# and suite rather than a cold `mix deps.get` + dependency build.  Sharded one
# feature per job, the setup (toolchain install, image pull, dependency build)
# was repeated a hundred times for under a minute of real work each.  CI has
# direct hex.pm access, so LOOM_HEX_MIRROR stays unset here (a no-op).
#
# Triggers: any change to the elixir generator subtree, the shared expression
# seam, the IR, the elixir platform surface / deployable validator, the corpus
# fixtures, or this leg's test — plus push:main and manual dispatch.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/elixir/**'
      - 'src/generator/_api/**'
      - 'src/generator/_expr/**'
      - 'src/generator/_imports/**'
      - 'src/generator/_openapi/**'
      - 'src/platform/elixir.ts'
      # Shared emission seams the platform tree above delegates into: `_stmt` is
      # the StmtIR dispatcher this backend's leaf table plugs into, `_payload`
      # the one tagged-union wire shape, `_i18n` the validation-catalog
      # collector.  The leading underscore means SHARED, not per-target -- a
      # change confined to one of them changes what this gate compiles.  Derived
      # from this block's platform claim and pinned by
      # test/system/workflow-path-coverage.test.ts.
      - 'src/generator/_adapters/**'
      - 'src/generator/_api/**'
      - 'src/generator/_auth/**'
      - 'src/generator/_channels/**'
      - 'src/generator/_docker/**'
      - 'src/generator/_frontend/**'
      - 'src/generator/_i18n/**'
      - 'src/generator/_numeric/**'
      - 'src/generator/_obs/**'
      - 'src/generator/_openapi/**'
      - 'src/generator/_packs/**'
      - 'src/generator/_payload/**'
      - 'src/generator/_persistence/**'
      - 'src/generator/_stmt/**'
      - 'src/generator/_test/**'
      - 'src/generator/_trace/**'
      - 'src/generator/_walker/**'
      - 'src/generator/_workflow/**'
      - 'test/fixtures/corpus/**'
      - 'test/e2e/corpus-elixir-build.test.ts'
      - 'test/e2e/support/hex-mirror.ts'
      - 'test/e2e/support/mix-workspace.ts'
      - 'test/e2e/support/parallel.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/corpus-elixir-build.yml'
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every corpus feature in one job — see the header.  The feature list is
  # computed inside the test from the shared manifest, so adding a
  # `<feature>.ddd` extends this job with no workflow edit.
  corpus-elixir:
    # Draft PRs run only the fast lane (test.yml, langium-generated, workflow-lint,
    # pr-gate); this and the rest of the fan-out fire when the PR is marked ready
    # for review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: corpus × elixir (Phoenix)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # Docker Hub pulls flake: a registry timeout (Client.Timeout on
      # registry-1.docker.io) killed an otherwise-green run with exit 125
      # before any compile ran. Pre-pull with backoff so a transient hiccup
      # costs seconds, not the run. The tags are grepped from the test file —
      # the single source of truth — so a version bump cannot drift.
      - name: Pre-pull the hexpm/elixir + postgres images (retries)
        run: |
          IMG=$(grep -ohE 'hexpm/elixir:[A-Za-z0-9._-]+' test/e2e/support/mix-workspace.ts | head -1)
          PG=$(grep -ohE 'postgres:[0-9]+-alpine' test/e2e/corpus-elixir-build.test.ts | head -1)
          for img in "$IMG" "$PG"; do
            echo "pre-pulling $img"
            ok=0
            for i in 1 2 3 4; do
              if docker pull "$img"; then ok=1; break; fi
              echo "pull failed (attempt $i), retrying in $((i*10))s"; sleep $((i*10))
            done
            [ "$ok" = 1 ] || exit 1
          done

      - name: Restore the last toolchain build (incremental tsc)
        uses: ./.github/actions/restore-loom-build
      - name: Install Loom toolchain
        run: npm ci

      - name: mix compile + migrate + mix test every corpus feature (Elixir/Phoenix)
        run: npm run test:elixir-corpus

      - name: Surface failure context
        if: failure()
        run: |
          echo "## Corpus Elixir compile failed" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'The vitest report above names each failing feature and carries its captured `mix compile --warnings-as-errors`, `mix ecto.migrate` and `mix test --warnings-as-errors` output.' >> $GITHUB_STEP_SUMMARY
          echo 'Reproduce one feature locally: `LOOM_ELIXIR_BUILD=1 LOOM_CORPUS_ELIXIR_CASE=<feature> npx vitest run test/e2e/corpus-elixir-build.test.ts` (add LOOM_HEX_MIRROR=1 behind a TLS-fingerprinting proxy).' >> $GITHUB_STEP_SUMMARY
          echo 'A "STALE ELIXIR_TEST_WAIVERS entry" failure means a waived suite now passes: delete its line in that file (and lower the pin in test/platform/allowlist-ratchet.test.ts).' >> $GITHUB_STEP_SUMMARY

  # ── Merge-queue / branch-protection rollup ────────────────────────────
  # One stable check name for this workflow.  The jobs above are a matrix
  # (or a fan-out), so their check names are dynamic and cannot be named as
  # a required status check; this job can.  A skipped need counts as OK — a
  # label-guarded or path-skipped job is a legitimate no-op.  Kept honest by
  # test/system/merge-queue-readiness.test.ts; see docs/ci-gating.md.
  corpus-elixir-build-passed:
    name: corpus-elixir-build-passed
    # `!cancelled()`, not `always()`: when a newer push supersedes this run,
    # cancel-in-progress cancels the needed jobs — always() would then wake
    # this rollup later and convert the quiet supersession into a spurious
    # FAILURE check on the stale SHA (webhook noise for anyone babysitting
    # the PR). !cancelled() skips the rollup with the run; a LONE cancelled
    # need on a live run (a job timeout) still fails via the step below —
    # that is the "cancelled reads as not-failed" trap, kept closed. Same
    # pattern as test.yml's tests-passed.
    if: ${{ !cancelled() }}
    needs: [corpus-elixir]
    runs-on: ubuntu-latest
    steps:
      - name: fail if any needed job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
