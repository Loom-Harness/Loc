name: Channels (broker runtime e2e)

# Runtime e2e for cross-deployable broker eventing (channels.md, M-T4.4).
# 16 opt-in suites already exist under test/e2e/channels-e2e*.test.ts, each
# gated on its own LOOM_CHANNELS_E2E* env var with a matching `test:channels*`
# script in package.json — but until this workflow, NOTHING in CI ran any of
# them, so a broker-driver regression on any of the five backends could ship
# silently. This wires every one of the scripts as one job PER BACKEND — the
# backend's toolchain is set up once and its brokers run in sequence — plus
# the all-brokers-at-once auth leg:
#
#   node, python, dotnet, java, elixir — redis, rabbitmq, kafka
#   node-mikroorm                      — redis, rabbitmq
#   auth (all three at once)           — node only (M-T4.4 design §7)
#
# Each suite boots the GENERATED two-deployable system (producer salesApi +
# consumer shipApi, each with its own database) and proves the event crossed
# processes over the real broker — the runtime agreement the per-PR generator
# pins (test/generator/**/channels-*.test.ts) and the structural wiring
# validators (loom.channelsource-*, loom.channel-consumer-unwired) can't
# prove on their own.
#
# Sidecar strategy differs per broker, following each suite's own documented
# override knobs (LOOM_CHANNELS_PG_URL / _REDIS_URL / _AMQP_URL / _KAFKA_URL):
#   - postgres and redis (valkey) need no special boot incantation, so they
#     run as ordinary GitHub Actions `services:` containers (the email-e2e.yml
#     / tenancy-e2e.yml pattern) and the suites are pointed at them via the
#     PG/REDIS override envs.
#   - rabbitmq needs a cookie-permission preseed workaround under sandboxed
#     docker storage drivers (see channels-e2e-rabbit.test.ts), and kafka
#     needs a multi-listener KRaft config — both already scripted INSIDE the
#     suites via `docker run` (ubuntu-latest ships a running docker daemon).
#     Rather than duplicate that fragile setup as a `services:` block, these
#     legs only override LOOM_CHANNELS_PG_URL (postgres via `services:`) and
#     let the suite self-provision its own rabbitmq/kafka sidecar exactly as
#     it does locally. NOTE: this means the docker-only DLQ assertions inside
#     those suites still run here (no AMQP/KAFKA override is set) — nothing
#     is lost, this is the fullest-coverage path, just not the `services:`
#     pattern for those two brokers. Flagged for first-CI-run verification.
#   - the auth leg (test:channels-auth) provisions ALL THREE brokers itself
#     with GENERATED credentials/definitions mounted from the emitted
#     `docker-compose.yml` / `broker-init/` — it has no override knobs at all
#     (see channels-e2e-auth.test.ts), so it gets no `services:` block, just
#     postgres via `services:` for consistency with the other legs.
#
# TIER: the merge queue — `merge_group:` runs every suite on the rebased
# candidate, so a broker regression is caught before it lands, not on a red
# `main`.  The merge group is this gate's ONLY pre-merge run: on a pull request
# it still needs the `run-channels` label (an earlier signal, not the gate).
# Chosen over a per-PR `paths:` promotion by measurement (2026-10-05, Actions
# API): 18 suites of 1.3-3.3 runner-minutes each, ~34 runner-minutes a
# firing, now 7 jobs; a per-PR block carrying the generation path would fire
# all of them on every `src/ir/**` push.
on:
  workflow_dispatch:
  # The merge queue runs every suite against the rebased candidate; `merge_group`
  # is not `pull_request`, so the label guard on each job short-circuits true.
  merge_group:
  # On-demand per-PR run: apply the `run-channels` label to a PR to run this
  # suite against that branch before it reaches the queue.
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Every broker, one job per backend.  The backend's toolchain is set up
  # once and its suites run one after another: redis (broadcast/ephemeral,
  # valkey as a `services:` container via LOOM_CHANNELS_REDIS_URL), rabbitmq
  # (queue/work — exactly-one-of-N competing consumers + DLQ parking) and
  # kafka (broadcast/log), the last two self-provisioning their broker with
  # `docker run` exactly as they do locally (rabbitmq needs its cookie
  # preseed, kafka its multi-listener KRaft config).  Each suite boots the
  # GENERATED producer (salesApi) and consumer (shipApi), each with its own
  # database, recreated empty before every suite.  A failing suite does not
  # stop the next: the job runs them all and fails if any failed.
  # ---------------------------------------------------------------------
  channels-e2e:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-channels'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: node
            scripts: test:channels test:channels-rabbit test:channels-kafka
          # The SECOND node persistence adapter: the same choreography with
          # `persistence: mikroorm` forced onto both deployables, so the broker
          # DRIVER + producer tee + consumer loop are proven at runtime on that
          # adapter.  Its rabbit suite is the one that runs the OUTBOX RELAY
          # (queue/work is the only shipped durable broker combo); it has no
          # kafka suite.
          - backend: node-mikroorm
            scripts: test:channels-mikroorm test:channels-rabbit-mikroorm
          - backend: python
            scripts: test:channels-python test:channels-rabbit-python test:channels-kafka-python
          - backend: dotnet
            scripts: test:channels-dotnet test:channels-rabbit-dotnet test:channels-kafka-dotnet
          - backend: java
            scripts: test:channels-java test:channels-rabbit-java test:channels-kafka-java
          - backend: elixir
            scripts: test:channels-elixir test:channels-rabbit-elixir test:channels-kafka-elixir
    name: channels-e2e (${{ matrix.backend }})
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up uv (python)
        if: matrix.backend == 'python'
        uses: astral-sh/setup-uv@v7

      - name: Set up JDK (java)
        if: matrix.backend == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Java 25 toolchain needs Gradle 9.1+ (no wrapper is emitted).
      - name: Set up Gradle (java)
        if: matrix.backend == 'java'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up .NET (dotnet)
        if: matrix.backend == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Elixir/OTP (elixir)
        if: matrix.backend == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'

      - name: Restore the last toolchain build (incremental tsc)
        uses: ./.github/actions/restore-loom-build
      - name: Install Loom toolchain
        run: npm ci

      - name: Run every broker's channels runtime e2e (${{ matrix.backend }})
        env:
          LOOM_CHANNELS_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          LOOM_CHANNELS_REDIS_URL: redis://127.0.0.1:6379
          SCRIPTS: ${{ matrix.scripts }}
        run: |
          failed=""
          for script in $SCRIPTS; do
            echo "::group::$script"
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres \
              -c "DROP DATABASE IF EXISTS sales_api WITH (FORCE);" \
              -c "DROP DATABASE IF EXISTS ship_api WITH (FORCE);" \
              -c "CREATE DATABASE sales_api;" -c "CREATE DATABASE ship_api;"
            npm run "$script" -- --reporter=verbose || failed="$failed $script"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed:$failed"
            echo "## Channels runtime e2e failed (${{ matrix.backend }}):$failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ---------------------------------------------------------------------
  # auth — all three brokers wired at once, credentialed (M-T4.4 slice 5a).
  # Node only. The suite provisions redis/rabbitmq/kafka itself from the
  # GENERATED docker-compose.yml / broker-init/ artifacts (credentials,
  # RabbitMQ definitions, Kafka JAAS line aren't known until `generate
  # system` runs), so it has no override knobs and gets no broker
  # `services:` blocks — only postgres, for consistency with the other jobs.
  # ---------------------------------------------------------------------
  channels-e2e-auth:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-channels'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: channels-e2e-auth (node)
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore the last toolchain build (incremental tsc)
        uses: ./.github/actions/restore-loom-build
      - name: Install Loom toolchain
        run: npm ci

      - name: Create per-deployable databases
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE sales_api;" -c "CREATE DATABASE ship_api;"

      # The suite provisions valkey/rabbitmq/kafka itself (docker run,
      # reading the generated compose file for credentials/definitions/JAAS)
      # — only postgres is handed in via override.
      - name: Run channels auth runtime e2e (node, all three brokers)
        env:
          LOOM_CHANNELS_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:channels-auth -- --reporter=verbose

      - name: Surface failure context
        if: failure()
        run: |
          echo "## Channels auth runtime e2e failed" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Generates ONE system wiring all three brokers at once (redis broadcast/ephemeral + rabbitmq queue/work + kafka broadcast/log) and provisions each broker EXACTLY as the generated artifacts say (valkey `--requirepass`, the generated RabbitMQ `broker-init/` definitions, the generated Kafka JAAS line). Asserts POSITIVE delivery across deployables on every broker, and NEGATIVE credential-less refusal per broker (valkey NOAUTH, rabbitmq'"'"'s default `guest` account gone, kafka'"'"'s SASL-less client rejected).' >> $GITHUB_STEP_SUMMARY

  # ── Merge-queue / branch-protection rollup ────────────────────────────
  # One stable check name for this workflow.  The jobs above are matrices, so
  # their check names are dynamic and cannot be named as a required status
  # check; this job can.  A skipped need counts as OK — a label-guarded or
  # path-skipped job is a legitimate no-op.  Kept honest by
  # test/system/merge-queue-readiness.test.ts; see docs/ci-gating.md.
  channels-e2e-passed:
    name: channels-e2e-passed
    # `!cancelled()`, not `always()`: a superseded run's cancellation skips the
    # rollup with it instead of posting a spurious FAILURE on the stale SHA; a
    # lone cancelled need on a live run (a job timeout) still fails below.
    if: ${{ !cancelled() }}
    needs: [channels-e2e, channels-e2e-auth]
    runs-on: ubuntu-latest
    steps:
      - name: fail if any needed job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
