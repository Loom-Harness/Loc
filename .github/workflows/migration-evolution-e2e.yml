name: Migration evolution (runtime e2e)

# The runtime companion to the rename/baseline/data-migration language work
# (M-T2.1/M-T2.2/M-T2.3).  The per-PR compile/first-boot tiers prove a migration
# EMITS and applies to a FRESH database; nothing proved it EVOLVES correctly on
# data that already exists — the silent-data-loss class.  This gate runs two
# runtime checks per SQL backend against a real Postgres:
#
#   (1) migrate-vs-create equivalence — the schema after applying the full
#       migration chain (Initial v1 -> delta v2) must equal a FRESH create of
#       the head (v2) model (catches an ALTER that drifts from the CREATE).
#   (2) populated forward-migrate — seed a v1 row through REST, evolve the .ddd
#       to v2, apply the derived forward migration, assert the row SURVIVES with
#       correct values (renamed column value preserved, back-filled NOT-NULL
#       populated, nullable add NULL).
#
# The shared assertion + schema-fingerprint harness lives in
# test/e2e/support/migration-evolution-harness.ts and is backend-agnostic; the
# per-backend files differ only in boot mechanics (mirroring tenancy-isolation).
# Fixtures: test/e2e/fixtures/migration-evolution/{base,evolved}.ddd.
#
# Uses one `services: postgres` container.  The harness creates two databases in
# it (`chain`, `fresh`) — CHECK 1 needs the chain schema and the fresh-create
# schema side by side — so it needs the MAINTENANCE db, which is why the URL
# handed via LOOM_MIGRATION_PG_URL is only used for host/port/credentials (the
# harness drops+creates `chain`/`fresh` itself).  Schema introspection uses host
# `psql` (preinstalled on the runner, as the tenancy-hierarchy gate relies on).
#
# TIER: per-PR, path-scoped, binding through `pr-gate`, AND in the merge queue,
# with `push: main` kept as the post-merge regression net.  The 35-minute cap
# is a ceiling, not the cost: measured 2026-10-05 (Actions API, last 10 `main`
# runs) a cell takes 1.2-3.0 runner-minutes and a firing ~10, well under the
# ~22-minute corpus compile legs that bound a PR's `pr-gate` cycle, so a
# per-PR run does not move that cycle.  It stays in the queue as well because
# the per-PR block is path-scoped: the merge group is the full-tree run that
# catches a migration break arriving through a file this list does not name.
# Heavier than tenancy per cell (three boots + two build trees), hence the cap.
on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/sql-pg.ts'
      - 'src/generator/_persistence/**'
      - 'src/generator/elixir/migrations-emit.ts'
      # The Drizzle journal (`meta/_journal.json`) and its ordering key.  Drizzle
      # is the only backend here whose migrator is a WATERMARK
      # (`lastApplied.created_at < entry.when`) rather than an applied-set, so
      # the journal is the one migration artifact whose ordering can silently
      # skip a migration or re-run an applied one — F-012, which this gate's
      # `journal-ordering` leg now covers.  Omitting this path meant the file
      # carrying that defect could not trigger the gate that catches it.
      - 'src/generator/typescript/emit/migrations.ts'
      - 'test/e2e/migration-evolution.test.ts'
      - 'test/e2e/migration-evolution-python.test.ts'
      - 'test/e2e/migration-evolution-java.test.ts'
      - 'test/e2e/migration-evolution-dotnet.test.ts'
      - 'test/e2e/migration-evolution-elixir.test.ts'
      - 'test/e2e/support/migration-evolution-harness.ts'
      - 'test/e2e/fixtures/migration-evolution/**'
      - 'package.json'
      - '.github/workflows/migration-evolution-e2e.yml'
  # Per-PR, path-scoped: binding because `pr-gate` fails on any non-passing
  # check run present on the head SHA.  `ready_for_review` re-fires the leg
  # when a draft flips; `labeled` is deliberately absent (a label event would
  # re-run the boots and, with PR-aware concurrency, cancel the live run).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # DUPLICATED list, never a YAML anchor: the reader in
      # test/system/workflow-path-coverage.test.ts does not resolve
      # `&paths` / `*paths`, and it reads each trigger's block on its own.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/sql-pg.ts'
      - 'src/generator/_persistence/**'
      - 'src/generator/elixir/migrations-emit.ts'
      # The Drizzle journal and its ordering key (see the `push:` block).
      - 'src/generator/typescript/emit/migrations.ts'
      - 'test/e2e/migration-evolution.test.ts'
      - 'test/e2e/migration-evolution-python.test.ts'
      - 'test/e2e/migration-evolution-java.test.ts'
      - 'test/e2e/migration-evolution-dotnet.test.ts'
      - 'test/e2e/migration-evolution-elixir.test.ts'
      - 'test/e2e/support/migration-evolution-harness.ts'
      - 'test/e2e/fixtures/migration-evolution/**'
      - '.github/workflows/migration-evolution-e2e.yml'
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  # Keyed on the PR number when there is one so a superseded PR push cancels
  # its own in-flight boots; `push: main` and merge-group runs keep per-ref
  # attribution and are never cancelled (cancel-in-progress is false off
  # `pull_request`).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migration-evolution-e2e:
    # Draft PRs run only the fast lane (test.yml, langium-generated,
    # workflow-lint, pr-gate); this leg fires once the PR is marked ready for
    # review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    # Pinned verbatim by test/system/draft-gate.test.ts.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Cold path is dominated by the generated project's build/dep install run
    # TWICE (evolution tree + fresh tree) plus three boots. 35min cap.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: node
            script: test:migration-evolution
          - backend: python
            script: test:migration-evolution-python
          - backend: java
            script: test:migration-evolution-java
          - backend: dotnet
            script: test:migration-evolution-dotnet
          - backend: elixir
            script: test:migration-evolution-elixir
    name: migration-evolution-e2e (${{ matrix.backend }})
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up uv (python)
        if: matrix.backend == 'python'
        uses: astral-sh/setup-uv@v7

      - name: Set up JDK (java)
        if: matrix.backend == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Java 25 toolchain needs Gradle 9.1+ (no wrapper is emitted).
      - name: Set up Gradle (java)
        if: matrix.backend == 'java'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up .NET (dotnet)
        if: matrix.backend == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Elixir/OTP (elixir)
        if: matrix.backend == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'

      - name: Install Loom toolchain
        run: npm ci

      - name: Run migration-evolution runtime e2e (${{ matrix.backend }})
        env:
          LOOM_MIGRATION_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/app
        run: npm run ${{ matrix.script }} -- --reporter=verbose

      - name: Surface failure context
        if: failure()
        run: |
          echo "## Migration-evolution runtime e2e failed (${{ matrix.backend }})" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'See the run step above for the captured server stdout.' >> $GITHUB_STEP_SUMMARY
          echo 'The test seeds a v1 row, evolves the .ddd to v2, applies the derived forward migration, and asserts (1) the migrate-chain schema equals a fresh create of the head model, and (2) the seeded row survives with correct values (renamed column preserved, back-filled NOT-NULL populated, nullable add NULL).' >> $GITHUB_STEP_SUMMARY

  # ── Merge-queue / branch-protection rollup ────────────────────────────
  # One stable check name for this workflow.  The jobs above are a matrix
  # (or a fan-out), so their check names are dynamic and cannot be named as
  # a required status check; this job can.  A skipped need counts as OK — a
  # label-guarded or path-skipped job is a legitimate no-op.  Kept honest by
  # test/system/merge-queue-readiness.test.ts; see docs/ci-gating.md.
  migration-evolution-e2e-passed:
    name: migration-evolution-e2e-passed
    # `!cancelled()`, not `always()`: when a newer push supersedes this run,
    # cancel-in-progress cancels the needed jobs — always() would then wake
    # this rollup later and convert the quiet supersession into a spurious
    # FAILURE check on the stale SHA (webhook noise for anyone babysitting
    # the PR). !cancelled() skips the rollup with the run; a LONE cancelled
    # need on a live run (a job timeout) still fails via the step below —
    # that is the "cancelled reads as not-failed" trap, kept closed. Same
    # pattern as test.yml's tests-passed.
    if: ${{ !cancelled() }}
    needs: [migration-evolution-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: fail if any needed job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
