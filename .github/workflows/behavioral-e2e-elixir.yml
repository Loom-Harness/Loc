name: Behavioral e2e — Elixir (plain Ecto/Phoenix)

# M-T9.3 — the behavioral tier's FIFTH and final backend. The node tier
# (behavioral-e2e.yml) boots Hono in-process on PGlite; Phoenix has no
# in-process Postgres, so this boots the GENERATED Phoenix backend as a real
# process against a `services: postgres` sidecar and HTTP-dispatches the SAME
# emitted `test e2e` api suite at it (the emitted suite is backend-agnostic —
# written against the HTTP contract).
#
# This moves the *behavioral* runtime-semantics RS-rules
# (docs/conformance-semantics.md) onto a FIFTH backend per-PR: camelCase keys
# both directions (RS-1), enum declared casing (RS-2), no leaked columns
# (RS-3), temporal round-trip (RS-4), bool create default (RS-6), value-object
# survival (RS-7), association round-trip (RS-8). See
# https://github.com/Loom-Harness/Loc/blob/cadbe3ba12fb833565704cb9d628c8f41b2090a8/docs/new-plan/T9-toolchain-health.md (M-T9.3).
#
# Reuses the proven boot recipe from elixir-vanilla-obs-e2e.yml (setup-beam +
# mix deps.get + ecto.create/migrate + phx.server against DATABASE_URL) and the
# harness wiring from behavioral-e2e-java.yml. CI runners have direct hex.pm
# access, so no hex mirror is needed here (unlike local runs behind a
# TLS-fingerprint egress proxy — see CLAUDE.md).

on:
  # Nightly run on main: this leg is not in the merge queue, so the nightly
  # run is what checks it against the combined tree (docs/ci-gating.md,
  # "Post-merge net").
  schedule:
    - cron: '29 3 * * *'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/ir/**'
      - 'src/generator/elixir/**'
      - 'src/generator/_expr/**'
      - 'src/platform/elixir.ts'
      # Shared emission seams the platform tree above delegates into: `_stmt` is
      # the StmtIR dispatcher this backend's leaf table plugs into, `_payload`
      # the one tagged-union wire shape, `_i18n` the validation-catalog
      # collector.  The leading underscore means SHARED, not per-target -- a
      # change confined to one of them changes what this gate compiles.  Derived
      # from this block's platform claim and pinned by
      # test/system/workflow-path-coverage.test.ts.
      - 'src/generator/_adapters/**'
      - 'src/generator/_auth/**'
      - 'src/generator/_channels/**'
      - 'src/generator/_docker/**'
      - 'src/generator/_frontend/**'
      - 'src/generator/_i18n/**'
      - 'src/generator/_numeric/**'
      - 'src/generator/_obs/**'
      - 'src/generator/_packs/**'
      - 'src/generator/_payload/**'
      - 'src/generator/_persistence/**'
      - 'src/generator/_stmt/**'
      - 'src/generator/_test/**'
      - 'src/generator/_trace/**'
      - 'src/generator/_walker/**'
      - 'src/generator/_workflow/**'
      - 'web/src/testing/**'
      - 'test/behavioral/**'
      - 'test/support/**'
      # The typed corpus manifest + its fixtures are this tier's CASE LIST:
      # `cases.mjs` derives every feature case from them, so a fixture that
      # grows a `test e2e`/`test` block mints a case (and needs a wire golden)
      # here.  Without this a pure-fixture PR fires none of the behavioural
      # legs — `corpus-build.yml` watches the same dir for the compile tier.
      - 'test/fixtures/corpus/**'
      # The cross-backend wire differential (M-T9.11): a change to the differ or
      # to the canonical goldens must re-verify THIS backend against them.
      - 'test/_helpers/wire-record.ts'
      - 'test/_helpers/wire-waivers.ts'
      - 'test/_helpers/response-diff.ts'
      - '.github/workflows/behavioral-e2e-elixir.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # false, not true: GitHub always auto-cancels a QUEUED-but-not-started run in
  # this group the moment a newer one lands, so this can't build a backlog —
  # it only protects an already-RUNNING job from being killed mid-flight by
  # the next push. With `true`, main's push cadence (a new commit roughly
  # every 15-60 min) kept cancelling this job before the Erlang/OTP setup +
  # `mix deps.get` + compile + boot sequence (15-20 min) ever finished, so it
  # went ~2 days without a single non-cancelled run. Matches the pattern
  # tenancy-e2e.yml / hono-oidc-e2e.yml already use to stay green under the
  # same cadence.
  # ...but on a PR ref a superseded push SHOULD cancel the stale run — only
  # the latest commit gets gated, and a queued 15-20min Elixir boot from a
  # dead SHA is pure runner-slot waste. The per-ref group keeps the two
  # regimes from ever touching each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  behavioral-elixir:
    # Draft PRs run only the fast lane (test.yml, langium-generated, workflow-lint,
    # pr-gate); this and the rest of the fan-out fire when the PR is marked ready
    # for review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # 45 → 30. The old budget existed because this leg recompiled the ENTIRE hex
    # dep tree (phoenix/ecto/postgrex/open_api_spex/opentelemetry → grpcbox +
    # chatterbox rebar3 builds) once PER CASE — ~30 identical compiles a run,
    # which is why it took 3-5x every other behavioral leg and had been silently
    # CANCELLED at its ceiling more than once (a cancelled job reads as "not
    # failed", which is exactly how a gate stops being read).
    #
    # run-elixir.mjs now primes that dep build ONCE per dep set and reuses it
    # (MIX_DEPS_PATH + symlinked `_build/<env>/lib/<dep>`); the generated app
    # still compiles from scratch every case, so nothing is masked. Measured
    # locally (4-core, docker hexpm/elixir, real postgres): a case that spent
    # ~57 s on dep+app compile now takes ~7 s, and the WHOLE 31-case corpus runs
    # in 6m35s — ~4 min of which is the two cold dep-set primes (base +
    # joken/OIDC) that the cache below removes on a restore.
    # Budget per docs/ci-gating.md § "Sizing a job's `timeout-minutes`":
    # 50 % margin over the measured p95, rounded up to 5 min, floor 10.
    # Measured 2026-11-02, n=20 successful runs: p95 19m39s, max 19m52s.
    # Re-derive with `node test/behavioral/ci-budget-report.mjs`.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The broker sidecar of the hermetic fake-service kit
      # (test/support/fakes/broker-sidecar.mjs): a case whose model declares a
      # `rabbitmq` storage gets its generated definitions imported here and
      # its publishes tapped.  Pinned to the same digest as BROKER_IMAGES.
      rabbitmq:
        image: rabbitmq:4.1-management-alpine@sha256:42c6214e0e2093caa2484718faacb733631cc9ddc869b3298397613237dbea4a
        env:
          RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit loopback_users []"
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

      # The object-store sidecar of the same kit
      # (test/support/fakes/s3-sidecar.mjs): an S3-compatible server a case's
      # `s3` storage is pointed at.  Pinned to the same digest as S3_IMAGE.
      s3:
        image: adobe/s3mock:4.7.0@sha256:468ba0b0e87f20ad54fbb6085e98c143f5bd1e384a844fa12a58535b4e39d4aa
        ports:
          - 9090:9090


      # The mail sidecar of the same kit (test/support/fakes/mailpit-sidecar.mjs):
      # a case whose model declares an `smtp` storage sends to it, and its inbox
      # is read back into the golden's `effects`.  Pinned to MAILPIT_IMAGE.
      mailpit:
        image: mirror.gcr.io/axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports:
          - 1025:1025
          - 8025:8025
    env:
      LOOM_MAILPIT_SMTP: localhost:1025
      LOOM_MAILPIT_API: http://localhost:8025
      LOOM_FAKE_AMQP_URL: amqp://guest:guest@localhost:5672
      LOOM_FAKE_AMQP_MGMT_URL: http://localhost:15672
      LOOM_FAKE_S3_URL: http://localhost:9090
      # Ecto's DATABASE_URL (config/dev.exs honors it). Point at the postgres
      # sidecar above (POSTGRES_DB: app).
      DATABASE_URL: ecto://postgres:postgres@127.0.0.1:5432/app
      # Pinned here (not inline on setup-beam) so the dep-build cache key can
      # name the exact BEAM the warm artefacts were compiled by.
      OTP_VERSION: '27.3'
      ELIXIR_VERSION: '1.18.4'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # erlef/setup-beam — pinned to match elixir-vanilla-obs-e2e.yml so the
      # generated project's dep set resolves deterministically.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # Cache the hex registry/archives AND the WARM DEPENDENCY BUILD the runner
      # primes once per dep set (LOOM_ELIXIR_DEP_CACHE — see run-elixir.mjs).
      # Without the warm tree this leg recompiled the identical phoenix/ecto/
      # opentelemetry(+grpcbox/chatterbox rebar3) dep set once PER CASE; with it
      # the tree is compiled once per run, and this cache carries it across runs
      # so even the first case skips the cold dep compile.
      #
      # The key tracks the OTP/Elixir versions the BEAM artefacts were built by,
      # the vanilla shell-emit module that emits mix.exs, and the corpus
      # manifest + shared systems (a NEW case can introduce a NEW dep set — an
      # `auth {}` fixture pulls joken — and only a key change re-saves the tree).
      # Restoring a near-miss is safe regardless: the warm tree is
      # content-addressed by a hash of the generated `defp deps` block + the
      # Erlang/Elixir versions, so a tree that doesn't match is simply not used
      # (the runner primes a fresh one next to it, and prunes the dead one).
      - name: Cache hex + warm dependency build
        uses: actions/cache@v5
        with:
          path: |
            ~/.hex
            ~/.mix
            test/behavioral/.work-elixir/dep-cache
          key: hex-mix-behavioral-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-${{ hashFiles('src/generator/elixir/vanilla/shell-emit.ts', 'test/fixtures/corpus/manifest.ts', 'test/behavioral/systems/*.ddd') }}
          restore-keys: |
            hex-mix-behavioral-otp${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-
            hex-mix-behavioral-

      - name: Restore the last toolchain build (incremental tsc)
        uses: ./.github/actions/restore-loom-build
      - name: Install Loom toolchain
        run: npm ci

      - name: Build toolchain
        run: npm run build

      - name: Install behavioral harness deps
        working-directory: test/behavioral
        run: npm ci || npm install --no-audit --no-fund

      - name: Run Elixir behavioral tier (api gate, real Postgres)
        working-directory: test/behavioral
        run: node run-elixir.mjs
